name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every project with its own lockfile is tested, not just the first
        # one the lab happened to build — the active flagship is the code most
        # likely to break.
        project: ["rag-chunking-bench", "slm-judge-audit"]
        python-version: ["3.11", "3.12", "3.13"]
    name: ${{ matrix.project }} / py${{ matrix.python-version }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The judge runner (llama-cpp-python) is deliberately left out: it
        # compiles from source and no test needs it. The one test that would
        # is guarded and skips.
        run: uv sync --locked --group dev
      - name: Lint (non-blocking)
        run: uv run ruff check . --exit-zero
      - name: Run tests
        run: uv run pytest tests -q
